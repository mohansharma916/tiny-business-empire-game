# Local development: Nakama + PostgreSQL.
# 1. cp .env.example .env            (set POSTGRES_PASSWORD, letters and numbers only)
# 2. cp nakama.example.yml nakama.yml (change every CHANGE_ME value)
# 3. npm install && npm run build
# 4. docker compose up
# Client API: http://localhost:7350   Admin console: http://localhost:7351
# For production, also use docker-compose.prod.yml (adds HTTPS). See README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    # Pin an exact version; upgrade deliberately after reading Nakama's release notes.
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/nakama.yml
        --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama
    volumes:
      - ./nakama.yml:/nakama/data/nakama.yml:ro
      - ./build:/nakama/data/modules/build:ro
    ports:
      - "7350:7350" # client API (the game connects here)
      - "127.0.0.1:7351:7351" # admin console, local machine only
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
